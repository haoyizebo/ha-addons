name: 北京燃气
version: "1.0.10"
slug: bj_gas
description: 北京燃气数据采集，自动同步至 Home Assistant
url: https://github.com/haoyizebo/ha-addons
arch:
  - aarch64
  - amd64
  - armv7
image: ghcr.io/haoyizebo/ha-addon-bj-gas-{arch}
init: false
startup: application
boot: auto
hassio_api: true
hassio_role: default
options:
  user_id: ""
  access_token: ""
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_pass: ""
  poll_interval: 360
schema:
  user_id: str
  access_token: str
  mqtt_host: str
  mqtt_port: int
  mqtt_user: str?
  mqtt_pass: str?
  poll_interval: "int(360,)"
